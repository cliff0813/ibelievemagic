<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include_('Styles'); ?>
    <style>
      .admin-list { display: grid; gap: 0.75rem; }
      .admin-card { padding: 1rem; border: 1px solid #dce5e8; border-radius: 0.75rem; }
      .admin-card p { margin: 0.35rem 0; overflow-wrap: anywhere; }
      .admin-actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.75rem; }
      .admin-status { min-height: 1.5em; }
      .admin-status[aria-live] { overflow-wrap: anywhere; }
      .participant-details { margin: 0.5rem 0 0; padding-left: 1.25rem; }
      .course-editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.75rem; }
      .course-editor-field { display: grid; gap: 0.35rem; }
      .course-editor-field-wide { grid-column: 1 / -1; }
      .course-content-row { display: flex; align-items: end; gap: 0.55rem; margin: 0.5rem 0; }
      .course-content-row .course-editor-field { flex: 1; }
      .course-editor-actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">限管理員使用</p>
        <h1>課程報名管理</h1>
        <p class="intro">查看報名、審核取消申請及管理報名開關。操作紀錄會保留，不提供刪除功能。</p>
        <p id="admin-status" class="status admin-status" role="status" aria-live="polite"></p>
      </header>

      <section class="panel" aria-labelledby="course-editor-heading">
        <h2 id="course-editor-heading">新增課程</h2>
        <p>報名模式使用 AUTO，依課程截止日自動開放或關閉。</p>
        <form id="course-form">
          <div class="course-editor-grid">
            <div class="course-editor-field">
              <label for="course-id">課程 ID</label>
              <input id="course-id" name="courseId" type="text" required>
            </div>
            <div class="course-editor-field">
              <label for="course-title">課程名稱</label>
              <input id="course-title" name="title" type="text" required>
            </div>
            <div class="course-editor-field">
              <label for="course-date">日期</label>
              <input id="course-date" name="date" type="date" required>
            </div>
            <div class="course-editor-field">
              <label for="course-start-time">開始時間</label>
              <input id="course-start-time" name="startTime" type="time" required>
            </div>
            <div class="course-editor-field">
              <label for="course-end-time">結束時間</label>
              <input id="course-end-time" name="endTime" type="time" required>
            </div>
            <div class="course-editor-field">
              <label for="course-location">上課地點</label>
              <input id="course-location" name="location" type="text">
            </div>
            <div class="course-editor-field">
              <label for="course-mode">上課方式</label>
              <input id="course-mode" name="mode" type="text">
            </div>
            <div class="course-editor-field course-editor-field-wide">
              <label for="course-image">課程圖片網址</label>
              <input id="course-image" name="image" type="url">
            </div>
            <div class="course-editor-field course-editor-field-wide">
              <label for="course-description">課程說明</label>
              <textarea id="course-description" name="description" rows="4"></textarea>
            </div>
            <div class="course-editor-field">
              <label for="course-instructor">講師</label>
              <input id="course-instructor" name="instructor" type="text">
            </div>
            <div class="course-editor-field course-editor-field-wide">
              <label for="course-instructor-bio">講師簡介</label>
              <textarea id="course-instructor-bio" name="instructorBio" rows="3"></textarea>
            </div>
          </div>

          <h3>課綱</h3>
          <div id="course-outline"></div>
          <button id="add-outline-item" class="button button-secondary" type="button">新增課綱項目</button>

          <h3>費用</h3>
          <div id="course-pricing"></div>
          <button id="add-pricing-item" class="button button-secondary" type="button">新增費用級距</button>

          <div class="course-editor-actions">
            <button id="course-submit" class="button button-primary" type="submit">新增課程</button>
            <button id="cancel-course-edit" class="button button-secondary" type="button" hidden>取消編輯</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="course-heading">
        <h2 id="course-heading">課程報名開關</h2>
        <div id="course-list" class="admin-list"></div>
      </section>

      <section class="panel" aria-labelledby="cancellation-heading">
        <h2 id="cancellation-heading">待審取消與通知追蹤</h2>
        <div id="cancellation-list" class="admin-list"></div>
      </section>

      <section class="panel" aria-labelledby="booking-heading">
        <h2 id="booking-heading">報名紀錄</h2>
        <div id="booking-list" class="admin-list"></div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var statusElement = document.getElementById("admin-status");
        var bookingList = document.getElementById("booking-list");
        var cancellationList = document.getElementById("cancellation-list");
        var courseList = document.getElementById("course-list");
        var courseForm = document.getElementById("course-form");
        var courseIdInput = document.getElementById("course-id");
        var courseTitleInput = document.getElementById("course-title");
        var courseDateInput = document.getElementById("course-date");
        var courseStartTimeInput = document.getElementById("course-start-time");
        var courseEndTimeInput = document.getElementById("course-end-time");
        var courseLocationInput = document.getElementById("course-location");
        var courseModeInput = document.getElementById("course-mode");
        var courseImageInput = document.getElementById("course-image");
        var courseDescriptionInput = document.getElementById("course-description");
        var courseInstructorInput = document.getElementById("course-instructor");
        var courseInstructorBioInput = document.getElementById("course-instructor-bio");
        var courseOutline = document.getElementById("course-outline");
        var coursePricing = document.getElementById("course-pricing");
        var courseSubmit = document.getElementById("course-submit");
        var cancelCourseEdit = document.getElementById("cancel-course-edit");
        var editingCourseId = null;
        var courseIdGenerationError = false;

        function callServer(method) {
          var args = Array.prototype.slice.call(arguments, 1);
          return new Promise(function (resolve, reject) {
            var runner = google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject);
            runner[method].apply(runner, args);
          });
        }

        function setStatus(message, failed) {
          statusElement.textContent = message || "";
          statusElement.className =
            "status admin-status" + (failed ? " status-error" : " status-success");
        }

        function appendText(parent, tagName, text, className) {
          var element = document.createElement(tagName);
          element.textContent = text == null ? "" : String(text);
          if (className) element.className = className;
          parent.appendChild(element);
          return element;
        }

        function makeButton(label, className, handler) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "button " + className;
          button.textContent = label;
          button.addEventListener("click", handler);
          return button;
        }

        function makeCard(parent, title) {
          var card = document.createElement("article");
          card.className = "admin-card";
          appendText(card, "h3", title);
          parent.appendChild(card);
          return card;
        }

        function moveCourseRow(row, direction) {
          var parent = row.parentNode;
          var index = Array.prototype.indexOf.call(parent.children, row);
          if (direction < 0 && index > 0) {
            parent.insertBefore(row, parent.children[index - 1]);
          } else if (direction > 0 && index < parent.children.length - 1) {
            parent.insertBefore(parent.children[index + 1], row);
          }
        }

        function addOutlineRow(value) {
          var row = document.createElement("div");
          row.className = "course-content-row outline-row";
          var field = document.createElement("div");
          field.className = "course-editor-field";
          var label = appendText(field, "label", "課綱項目");
          var input = document.createElement("input");
          input.type = "text";
          input.name = "outline";
          input.required = true;
          input.value = value || "";
          label.appendChild(input);
          row.appendChild(field);
          row.appendChild(
            makeButton("上移", "button-secondary outline-move-up", function () {
              moveCourseRow(row, -1);
            }),
          );
          row.appendChild(
            makeButton("下移", "button-secondary outline-move-down", function () {
              moveCourseRow(row, 1);
            }),
          );
          row.appendChild(
            makeButton("移除此項", "button-secondary outline-remove-button", function () {
              row.remove();
            }),
          );
          courseOutline.appendChild(row);
        }

        function addPricingRow(item) {
          item = item || {};
          var row = document.createElement("div");
          row.className = "course-content-row pricing-row";

          var labelField = document.createElement("div");
          labelField.className = "course-editor-field";
          var label = appendText(labelField, "label", "費用名稱");
          var labelInput = document.createElement("input");
          labelInput.type = "text";
          labelInput.name = "pricingLabel";
          labelInput.required = true;
          labelInput.value = item.label || "";
          label.appendChild(labelInput);
          row.appendChild(labelField);

          var priceField = document.createElement("div");
          priceField.className = "course-editor-field";
          var priceLabel = appendText(priceField, "label", "金額");
          var priceInput = document.createElement("input");
          priceInput.type = "number";
          priceInput.name = "pricingPrice";
          priceInput.step = "any";
          priceInput.required = true;
          priceInput.value = item.price == null ? "" : item.price;
          priceLabel.appendChild(priceInput);
          row.appendChild(priceField);

          row.appendChild(
            makeButton("上移", "button-secondary pricing-move-up", function () {
              moveCourseRow(row, -1);
            }),
          );
          row.appendChild(
            makeButton("下移", "button-secondary pricing-move-down", function () {
              moveCourseRow(row, 1);
            }),
          );
          row.appendChild(
            makeButton("移除此級距", "button-secondary pricing-remove-button", function () {
              row.remove();
            }),
          );
          coursePricing.appendChild(row);
        }

        function prepareNewCourseForm() {
          editingCourseId = null;
          courseForm.reset();
          courseIdInput.readOnly = false;
          courseSubmit.textContent = "新增課程";
          cancelCourseEdit.hidden = true;
          courseOutline.replaceChildren();
          coursePricing.replaceChildren();
          addOutlineRow("");
          addPricingRow();
          courseIdGenerationError = false;
          try {
            if (typeof crypto === "undefined" || typeof crypto.randomUUID !== "function") {
              throw new Error("瀏覽器不支援安全的 UUID 產生功能");
            }
            courseIdInput.value = crypto.randomUUID();
            courseSubmit.disabled = false;
          } catch (error) {
            courseIdGenerationError = true;
            courseIdInput.value = "";
            courseSubmit.disabled = true;
            setStatus(
              "無法產生課程 ID：" + (error.message || error),
              true,
            );
          }
        }

        function beginCourseEdit(course) {
          editingCourseId = course.courseId;
          courseIdGenerationError = false;
          courseIdInput.value = course.courseId || "";
          courseIdInput.readOnly = true;
          courseTitleInput.value = course.title || "";
          courseDateInput.value = course.date || "";
          courseStartTimeInput.value = course.startTime || "";
          courseEndTimeInput.value = course.endTime || "";
          courseLocationInput.value = course.location || "";
          courseModeInput.value = course.mode || "";
          courseImageInput.value = course.image || "";
          courseDescriptionInput.value = course.description || "";
          courseInstructorInput.value = course.instructor || "";
          courseInstructorBioInput.value = course.instructorBio || "";
          courseOutline.replaceChildren();
          coursePricing.replaceChildren();
          (course.outline || []).forEach(addOutlineRow);
          (course.pricing || []).forEach(addPricingRow);
          courseSubmit.textContent = "更新課程";
          courseSubmit.disabled = false;
          cancelCourseEdit.hidden = false;
          setStatus("正在編輯「" + course.title + "」。", false);
        }

        function submitCourse(event) {
          event.preventDefault();
          if (courseIdGenerationError) {
            setStatus("無法安全產生課程 ID，請使用支援 UUID 的瀏覽器後重試。", true);
            return;
          }
          if (!courseForm.reportValidity()) return;

          var outline = Array.prototype.map.call(
            courseOutline.querySelectorAll('[name="outline"]'),
            function (input) { return input.value.trim(); },
          );
          if (outline.some(function (item) { return item === ""; })) {
            setStatus("請填寫所有課綱項目，或移除空白列。", true);
            return;
          }

          var pricing = [];
          var pricingRows = coursePricing.querySelectorAll(".pricing-row");
          for (var index = 0; index < pricingRows.length; index += 1) {
            var labelInput = pricingRows[index].querySelector('[name="pricingLabel"]');
            var priceInput = pricingRows[index].querySelector('[name="pricingPrice"]');
            var label = labelInput.value.trim();
            var price = Number(priceInput.value);
            if (
              label === "" ||
              priceInput.value.trim() === "" ||
              !isFinite(price)
            ) {
              setStatus("請填寫有效的費用名稱與數字金額。", true);
              return;
            }
            pricing.push({ label: label, price: price });
          }

          var payload = {
            courseId: courseIdInput.value.trim(),
            title: courseTitleInput.value,
            date: courseDateInput.value,
            startTime: courseStartTimeInput.value,
            endTime: courseEndTimeInput.value,
            location: courseLocationInput.value,
            mode: courseModeInput.value,
            image: courseImageInput.value,
            description: courseDescriptionInput.value,
            instructor: courseInstructorInput.value,
            instructorBio: courseInstructorBioInput.value,
            outline: outline,
            pricing: pricing,
          };
          var operation = editingCourseId ? "update" : "create";
          setStatus(operation === "update" ? "正在更新課程…" : "正在新增課程…", false);
          var request = editingCourseId
            ? callServer("updateAdminCourse", editingCourseId, payload)
            : callServer("createAdminCourse", payload);
          request.then(function () {
            setStatus(operation === "update" ? "課程已更新。" : "課程已新增。", false);
            prepareNewCourseForm();
            return refresh();
          }).catch(function (error) {
            setStatus(
              (operation === "update" ? "課程更新失敗：" : "課程新增失敗：") +
                (error.message || error),
              true,
            );
          });
        }

        function deleteCourse(course) {
          var confirmed = window.confirm(
            "確定刪除「" + course.title +
              "」？如有任何報名紀錄（包含已取消），系統會拒絕刪除。",
          );
          if (!confirmed) return;

          setStatus("正在刪除課程…", false);
          callServer("deleteAdminCourse", course.courseId).then(function () {
            if (editingCourseId === course.courseId) prepareNewCourseForm();
            setStatus("課程已刪除。", false);
            return refresh();
          }).catch(function (error) {
            setStatus("課程刪除失敗：" + (error.message || error), true);
          });
        }

        function renderBookings(bookings) {
          bookingList.replaceChildren();
          if (!bookings.length) {
            appendText(bookingList, "p", "目前沒有報名紀錄。");
            return;
          }
          bookings.forEach(function (booking) {
            var card = makeCard(
              bookingList,
              (booking.courseTitle || booking.courseId) + " · " + booking.courseDate,
            );
            appendText(card, "p", "狀態：" + booking.status);
            appendText(card, "p", "報名編號：" + booking.bookingId);
            appendText(card, "p", "團主：" + booking.leaderName);
            appendText(card, "p", "電話：" + booking.leaderPhone);
            appendText(card, "p", "Email：" + booking.leaderEmail);
            appendText(card, "p", "建立時間：" + booking.createdAt);
            appendText(
              card,
              "p",
              "確認信狀態：" + (booking.confirmationEmailStatus || "未記錄"),
            );
            var participants = document.createElement("ul");
            participants.className = "participant-details";
            (booking.participants || []).forEach(function (participant) {
              appendText(
                participants,
                "li",
                [participant.name, participant.phone, participant.email, participant.lineName]
                  .filter(Boolean)
                  .join(" · "),
              );
            });
            card.appendChild(participants);
          });
        }

        function renderCancellations(requests) {
          cancellationList.replaceChildren();
          if (!requests.length) {
            appendText(cancellationList, "p", "目前沒有待審或通知待追蹤的申請。");
            return;
          }
          requests.forEach(function (request) {
            var card = makeCard(
              cancellationList,
              (request.courseTitle || "課程") + " · " + request.bookingId,
            );
            appendText(card, "p", "取消申請：" + request.status);
            appendText(card, "p", "原因：" + (request.reason || "未提供"));
            appendText(card, "p", "團主：" + request.leaderName);
            appendText(card, "p", "通知 Email：" + request.leaderEmail);
            appendText(
              card,
              "p",
              "通知狀態：" + (request.notificationEmailStatus || "未記錄"),
            );
            if (request.notificationInProgress) {
              appendText(
                card,
                "p",
                "⚠ 通知處於「寄送中／結果不確定」狀態：可能正在寄送，或先前寄送被中斷而無法確認是否已送達。系統不會自動重寄，請手動聯絡團主確認。",
                "status status-error",
              );
            }
            if (request.notificationEmailStatus === "FAILED") {
              appendText(
                card,
                "p",
                "⚠ 通知寄送失敗：團主可能尚未收到取消結果通知。請手動聯絡團主跟進。",
                "status status-error",
              );
            }
            if (request.needsRecovery) {
              appendText(
                card,
                "p",
                "⚠ 此申請尚未完整處理（決定：" +
                  request.recoveryDecision +
                  "），需要恢復。請按「繼續完成」以相同決定安全續行；不可改為其他決定。",
                "status status-error",
              );
              var recoveryActions = document.createElement("div");
              recoveryActions.className = "admin-actions";
              recoveryActions.appendChild(
                makeButton("繼續完成", "button-primary", function () {
                  decide(request.requestId, request.recoveryDecision);
                }),
              );
              card.appendChild(recoveryActions);
            }
            if (request.needsCreationRecovery) {
              appendText(
                card,
                "p",
                "⚠ 此取消申請尚未完整建立（報名狀態未更新），需要恢復。請按「繼續建立」安全續行；完成前不可核准或拒絕。",
                "status status-error",
              );
              var creationActions = document.createElement("div");
              creationActions.className = "admin-actions";
              creationActions.appendChild(
                makeButton("繼續建立", "button-primary", function () {
                  recoverCreation(request.requestId);
                }),
              );
              card.appendChild(creationActions);
            } else if (request.status === "PENDING") {
              var actions = document.createElement("div");
              actions.className = "admin-actions";
              actions.appendChild(
                makeButton("核准取消", "button-primary", function () {
                  decide(request.requestId, "APPROVED");
                }),
              );
              actions.appendChild(
                makeButton("拒絕取消", "button-danger", function () {
                  decide(request.requestId, "REJECTED");
                }),
              );
              card.appendChild(actions);
            }
          });
        }

        function renderCourses(courses) {
          courseList.replaceChildren();
          if (!courses.length) {
            appendText(courseList, "p", "目前沒有課程資料。");
            return;
          }
          courses.forEach(function (course) {
            var card = makeCard(courseList, course.title + " · " + course.date);
            appendText(
              card,
              "p",
              "手動模式：" + (course.manualRegistrationMode || "AUTO"),
            );
            if (course.persisted) {
              var managementActions = document.createElement("div");
              managementActions.className = "admin-actions";
              managementActions.appendChild(
                makeButton("編輯", "button-secondary course-edit-button", function () {
                  beginCourseEdit(course);
                }),
              );
              managementActions.appendChild(
                makeButton("刪除", "button-danger course-delete-button", function () {
                  deleteCourse(course);
                }),
              );
              card.appendChild(managementActions);
            } else {
              appendText(
                card,
                "p",
                "此課程僅為網站備援資料，尚未存入試算表，無法編輯或刪除。",
              );
            }
            if (course.pendingRecovery) {
              appendText(
                card,
                "p",
                "⚠ 課程報名模式變更（" +
                  course.pendingRecovery.mode +
                  "）尚未完整處理，需要恢復。請按「繼續完成」安全續行。",
                "status status-error",
              );
              var courseRecoveryActions = document.createElement("div");
              courseRecoveryActions.className = "admin-actions";
              courseRecoveryActions.appendChild(
                makeButton("繼續完成", "button-primary", function () {
                  setCourseMode(course.courseId, course.pendingRecovery.mode);
                }),
              );
              card.appendChild(courseRecoveryActions);
              return;
            }
            var actions = document.createElement("div");
            actions.className = "admin-actions";
            actions.appendChild(
              makeButton("立即關閉", "button-danger", function () {
                setCourseMode(course.courseId, "CLOSED");
              }),
            );
            actions.appendChild(
              makeButton("手動開放", "button-secondary", function () {
                setCourseMode(course.courseId, "OPEN");
              }),
            );
            card.appendChild(actions);
          });
        }

        function refresh() {
          return Promise.all([
            callServer("listAdminBookings"),
            callServer("listAdminCancellationRequests"),
            callServer("listAdminCourses"),
          ]).then(function (results) {
            renderBookings(results[0]);
            renderCancellations(results[1]);
            renderCourses(results[2]);
            if (!courseIdGenerationError) setStatus("資料已更新。", false);
          }).catch(function (error) {
            setStatus("無法載入管理資料：" + (error.message || error), true);
          });
        }

        function decide(requestId, decision) {
          setStatus("正在儲存取消審核…", false);
          callServer("decideAdminCancellation", requestId, decision)
            .then(function (result) {
              setStatus(
                result.message,
                !result.success || result.notificationEmailStatus === "FAILED",
              );
              return refresh();
            })
            .catch(function (error) {
              setStatus("取消審核失敗：" + (error.message || error), true);
            });
        }

        function recoverCreation(requestId) {
          setStatus("正在繼續建立取消申請…", false);
          callServer("recoverAdminCancellationCreation", requestId)
            .then(function (result) {
              setStatus(result.message, !result.success);
              return refresh();
            })
            .catch(function (error) {
              setStatus("取消申請建立未完成：" + (error.message || error), true);
            });
        }

        function setCourseMode(courseId, mode) {
          setStatus("正在更新課程報名狀態…", false);
          callServer("setCourseRegistrationMode", courseId, mode)
            .then(function () {
              setStatus("課程報名狀態已更新。", false);
              return refresh();
            })
            .catch(function (error) {
              setStatus("課程狀態未更新：" + (error.message || error), true);
            });
        }

        document.getElementById("add-outline-item").addEventListener("click", function () {
          addOutlineRow("");
        });
        document.getElementById("add-pricing-item").addEventListener("click", function () {
          addPricingRow();
        });
        courseForm.addEventListener("submit", submitCourse);
        cancelCourseEdit.addEventListener("click", function () {
          prepareNewCourseForm();
          setStatus("已取消編輯。", false);
        });

        prepareNewCourseForm();
        refresh();
      })();
    </script>
  </body>
</html>
