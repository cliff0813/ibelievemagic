<style>
  :root {
    color-scheme: light;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: #233344;
    background: #f3f6f7;
    font-synthesis: none;
  }

  * { box-sizing: border-box; }

  body { margin: 0; }

  .page-shell {
    width: min(100% - 2rem, 760px);
    margin: 0 auto;
    padding: 2rem 0 3rem;
  }

  .page-header { padding: 0.5rem 0 1.25rem; }
  .eyebrow { color: #286d69; font-weight: 700; letter-spacing: 0.08em; }
  h1, h2, h3, p { line-height: 1.55; }
  h1 { margin: 0.25rem 0; font-size: clamp(1.8rem, 6vw, 2.5rem); }
  h2 { margin-top: 0; font-size: 1.45rem; }
  h3 { margin: 0; font-size: 1.1rem; }
  .intro { max-width: 42rem; color: #536575; }

  .panel, .result-card {
    margin: 1rem 0;
    padding: clamp(1rem, 4vw, 1.5rem);
    border: 1px solid #dce5e8;
    border-radius: 1rem;
    background: #fff;
    box-shadow: 0 0.4rem 1.4rem rgb(26 58 68 / 5%);
  }

  form { display: grid; gap: 0.65rem; }
  fieldset { min-width: 0; margin: 0.65rem 0; padding: 1rem; border: 1px solid #dce5e8; border-radius: 0.75rem; }
  legend { padding: 0 0.35rem; font-weight: 700; }
  label { font-weight: 650; }
  input, select, textarea {
    width: 100%;
    min-height: 2.8rem;
    padding: 0.65rem 0.75rem;
    border: 1px solid #aebec4;
    border-radius: 0.55rem;
    background: #fff;
    color: inherit;
    font: inherit;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 3px solid #80c4bd;
    outline-offset: 2px;
  }

  .choice, .consent-row { display: flex; align-items: flex-start; gap: 0.65rem; }
  .choice input, .consent-row input { width: 1.15rem; min-width: 1.15rem; min-height: 1.15rem; margin-top: 0.2rem; }
  .section-heading, .copy-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .participant-list { display: grid; gap: 0.75rem; }
  .participant-row { position: relative; }
  .participant-row legend { padding-right: 1rem; }
  .participant-row label { display: block; margin-top: 0.55rem; }
  .remove-participant { margin-top: 0.65rem; }
  .consent-row { margin: 1rem 0 0.35rem; font-weight: 500; }
  .status { min-height: 1.4em; margin: 0.25rem 0; color: #334d5d; }
  .status-error { color: #9a2828; }
  .status-success { color: #205e43; }
  .button {
    width: fit-content;
    min-height: 2.7rem;
    padding: 0.6rem 1rem;
    border: 0;
    border-radius: 0.55rem;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .button:disabled { cursor: wait; opacity: 0.65; }
  .button-primary { background: #286d69; color: #fff; }
  .button-secondary { border: 1px solid #8da7a6; background: #f5faf9; color: #245c59; }
  .button-danger { background: #8d3434; color: #fff; }
  .copy-row input { flex: 1; font-family: ui-monospace, monospace; }
  .cancellation-form { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #dce5e8; }
  .page-footer { margin-top: 1.5rem; color: #536575; font-size: 0.92rem; }

  @media (max-width: 520px) {
    .page-shell { width: min(100% - 1rem, 760px); padding-top: 1rem; }
    .copy-row { align-items: stretch; flex-direction: column; }
    .copy-row .button { width: 100%; }
  }
</style>
